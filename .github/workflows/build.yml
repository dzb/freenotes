name: Build FreeNotes

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional tag to publish, for example v1.0.6'
        required: false
        type: string
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            command: npx electron-builder --linux AppImage deb rpm --x64 --publish never
            files: |
              release/*.AppImage
              release/*.deb
              release/*.rpm
          - name: windows-x64
            os: windows-latest
            command: npx electron-builder --win nsis --x64 --publish never
            files: release/*.exe
          - name: macos-arm64-x64
            os: macos-latest
            command: npx electron-builder --mac dmg zip --arm64 --x64 --publish never
            files: |
              release/*.dmg
              release/*.zip
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: freenotes-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: FreeNotes ${{ inputs.release_tag }}
          fail_on_unmatched_files: true
          files: release-assets/**/*
          body: |
            ## FreeNotes ${{ inputs.release_tag }}

            本地优先的 macOS 风格笔记应用，支持 macOS、Windows 和 Linux。

            ### 本期更新

            - 主存储使用 SQLite，图片改为附件目录并通过数据库索引关联
            - 旧版 base64 图片会在首次启动时自动迁移为附件文件
            - 完整备份升级为 `.freenotes.zip`，包含 JSON 索引和附件文件
            - 每日自动备份改为轻量 SQLite 快照
            - 移除整库 120MB 保存上限
            - 单条 HTML/PDF 导出仍保持自包含
            - 兼容旧版 JSON 备份恢复
            - 搜索关闭时不再构建索引，编辑时只更新变化的单条搜索缓存
            - Linux 增加 Fedora/RHEL 可安装的 RPM 发行包
            - macOS 构建使用 ad-hoc 签名，修复无签名 App Bundle 被误判为已损坏的问题
            - macOS 使用系统原生红黄绿窗口按钮和原生应用菜单

            ### 下载

            - macOS Apple Silicon：`FreeNotes-1.0.6-arm64.dmg`
            - macOS Intel：`FreeNotes-1.0.6-x64.dmg`
            - Windows x64：`FreeNotes-1.0.6-x64.exe`
            - Linux x86_64：`FreeNotes-1.0.6-x86_64.AppImage` / `FreeNotes-1.0.6-amd64.deb` / `FreeNotes-1.0.6-x86_64.rpm`

            ### 说明

            当前 macOS 构建使用 ad-hoc 签名但未公证，Windows 构建未使用代码签名，系统可能显示安全提示。macOS 如果仍被 Gatekeeper 拦截，运行 xattr -dr com.apple.quarantine /Applications/FreeNotes.app 后重试；Windows 用户可能看到 SmartScreen 提示。
