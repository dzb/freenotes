name: Build FreeNotes

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            command: npx electron-builder --linux AppImage deb --x64 --publish never
            files: |
              release/*.AppImage
              release/*.deb
          - name: windows-x64
            os: windows-latest
            command: npx electron-builder --win nsis --x64 --publish never
            files: release/*.exe
          - name: macos-arm64-x64
            os: macos-latest
            command: npx electron-builder --mac dmg zip --arm64 --x64 --publish never
            files: |
              release/*.dmg
              release/*.zip
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: freenotes-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14
